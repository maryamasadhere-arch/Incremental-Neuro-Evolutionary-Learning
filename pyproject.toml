[project]
name = "inel"
version = "1.0.0"
description = "Incremental Neuro-Evolutionary Learning: baseline vs. 2007 EA replication vs. NEAT on Split-MNIST"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
